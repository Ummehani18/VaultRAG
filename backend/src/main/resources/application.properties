spring.application.name=vault-rag-backend
vaultrag.storage.documents=storage/documents

spring.datasource.url=jdbc:postgresql://localhost:5434/vaultrag
spring.datasource.username=vaultrag
spring.datasource.password=vaultrag_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET:VaultRAG-development-secret-key-change-this-later-123456}
jwt.expiration=3600000

#For our MVP, we'll support files up to 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ollama
vaultrag.ollama.base-url=http://localhost:11434
vaultrag.ollama.embedding-model=all-minilm
vaultrag.ollama.generation-model=llama3:latest

vaultrag.rag.max-distance=0.60