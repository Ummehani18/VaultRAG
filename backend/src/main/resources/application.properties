spring.application.name=vault-rag-backend

# Storage
vaultrag.storage.documents=${VAULTRAG_STORAGE_DOCUMENTS:storage/documents}

# Database
spring.datasource.url=${VAULTRAG_DB_URL:jdbc:postgresql://localhost:5434/vaultrag}
spring.datasource.username=${VAULTRAG_DB_USERNAME:vaultrag}
spring.datasource.password=${VAULTRAG_DB_PASSWORD:vaultrag_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# File upload
# MVP limit: 10 MB
spring.servlet.multipart.max-file-size=${VAULTRAG_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${VAULTRAG_MAX_REQUEST_SIZE:10MB}

# Ollama
vaultrag.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
vaultrag.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:all-minilm}
vaultrag.ollama.generation-model=${OLLAMA_GENERATION_MODEL:llama3.2:1b}

# LLM Generation
vaultrag.ollama.temperature=${OLLAMA_TEMPERATURE:0.2}
vaultrag.ollama.seed=${OLLAMA_SEED:42}
vaultrag.ollama.num-predict=${OLLAMA_NUM_PREDICT:300}
vaultrag.ollama.repeat-penalty=${OLLAMA_REPEAT_PENALTY:1.1}
vaultrag.ollama.top-p=${OLLAMA_TOP_P:0.8}
vaultrag.ollama.top-k=${OLLAMA_TOP_K:40}

# RAG
vaultrag.rag.max-distance=${VAULTRAG_RAG_MAX_DISTANCE:0.60}

# Initial admin bootstrap
vaultrag.admin.bootstrap-enabled=${VAULTRAG_ADMIN_BOOTSTRAP_ENABLED:false}
vaultrag.admin.username=${VAULTRAG_ADMIN_USERNAME:}
vaultrag.admin.password=${VAULTRAG_ADMIN_PASSWORD:}

# VaultRAG uses JWT authentication; disable Spring Boot's default user
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# CORS
vaultrag.cors.allowed-origins=${VAULTRAG_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never