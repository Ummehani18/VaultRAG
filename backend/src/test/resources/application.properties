spring.application.name=vault-rag-backend-test

# Test database
spring.datasource.url=jdbc:postgresql://localhost:5434/vaultrag_test
spring.datasource.username=vaultrag
spring.datasource.password=vaultrag_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Database schema
spring.jpa.hibernate.ddl-auto=validate

# Let Flyway create/update the test schema
spring.flyway.enabled=true

# JWT
jwt.secret=VaultRAG-test-secret-key-change-this-later
jwt.expiration=3600000

# File storage
vaultrag.storage.documents=storage/test-documents

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ollama
vaultrag.ollama.base-url=http://localhost:11434
vaultrag.ollama.embedding-model=all-minilm
vaultrag.ollama.generation-model=llama3.2:1b

# RAG
vaultrag.rag.max-distance=0.60